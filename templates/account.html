<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Administrator Account</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                padding: 24px;
                background: rgba(239, 226, 207, 0.96);
                color: #613604;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
            }
            main {
                width: min(100%, 560px);
                margin: 0 auto;
            }
            h1 {
                margin: 0 0 18px;
                font-size: 32px;
            }
            .account-form {
                padding: 18px;
                border: 1px solid rgba(97, 54, 4, 0.3);
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.46);
            }
            .field {
                display: grid;
                gap: 6px;
                margin: 12px 0;
            }
            label {
                font-weight: 600;
            }
            input {
                width: 100%;
                min-height: 42px;
                padding: 8px 10px;
                border: 1px solid #b9a78f;
                border-radius: 6px;
                background: #fffdf9;
                color: #33200d;
                font: inherit;
            }
            .hint {
                margin: 2px 0 0;
                color: #684d31;
                font-size: 14px;
            }
            .actions {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 12px;
                margin-top: 18px;
            }
            button,
            .back-link {
                min-height: 44px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 8px 16px;
                border: 0;
                border-radius: 7px;
                background: #8b5e34;
                color: white;
                font: inherit;
                font-weight: bold;
                text-decoration: none;
                cursor: pointer;
            }
            .back-link {
                border: 1px solid #8b5e34;
                background: transparent;
                color: #613604;
            }
            button:hover {
                background: #5c3801;
            }
            .back-link:hover {
                background: rgba(97, 54, 4, 0.1);
            }
            button:disabled {
                cursor: wait;
                opacity: 0.7;
            }
            #account-status {
                margin: 0;
                font-size: 15px;
            }
            #account-status.error {
                color: #a00000;
            }
            @media (max-width: 480px) {
                body {
                    padding: 16px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Administrator Account</h1>
            <form id="account-form" class="account-form" action="{{ url_for('save_admin_account') }}">
                <div class="field">
                    <label for="admin-username">Username</label>
                    <input id="admin-username" name="admin_username" type="text" value="{{ admin_username }}" autocomplete="username" required maxlength="100">
                </div>
                <div class="field">
                    <label for="current-password">Current password</label>
                    <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
                </div>
                <div class="field">
                    <label for="new-password">New password</label>
                    <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="8">
                    <p class="hint">Leave blank to keep the current password. Use at least 8 characters to change it.</p>
                </div>
                <div class="field">
                    <label for="confirm-password">Confirm new password</label>
                    <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8">
                </div>
                <div class="actions">
                    <button type="submit">Save account</button>
                    <a class="back-link" href="{{ url_for('admin') }}">Back to admin</a>
                    <p id="account-status" role="status" aria-live="polite"></p>
                </div>
            </form>
        </main>
        <script>
            const accountForm = document.querySelector('#account-form');
            const accountStatus = document.querySelector('#account-status');
            const accountSaveButton = accountForm.querySelector('button[type="submit"]');

            accountForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                accountStatus.textContent = '';
                accountStatus.classList.remove('error');

                const newPassword = accountForm.elements.new_password.value;
                if (newPassword !== accountForm.elements.confirm_password.value) {
                    accountStatus.textContent = 'New passwords do not match.';
                    accountStatus.classList.add('error');
                    return;
                }

                accountSaveButton.disabled = true;
                accountStatus.textContent = 'Saving…';
                try {
                    const response = await fetch(accountForm.action, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify({
                            admin_username: accountForm.elements.admin_username.value,
                            current_password: accountForm.elements.current_password.value,
                            new_password: newPassword,
                        }),
                    });
                    const result = await response.json();
                    if (!response.ok || result.success !== true) {
                        throw new Error(result.error || 'Could not save account settings.');
                    }
                    accountForm.elements.admin_username.value = result.admin_username;
                    accountForm.elements.current_password.value = '';
                    accountForm.elements.new_password.value = '';
                    accountForm.elements.confirm_password.value = '';
                    accountStatus.textContent = 'Account settings saved.';
                } catch (error) {
                    accountStatus.textContent = error.message || 'Could not save account settings.';
                    accountStatus.classList.add('error');
                } finally {
                    accountSaveButton.disabled = false;
                }
            });
        </script>
    </body>
</html>
