<html>
    <head>
        <meta charset="UTF-8">
        <title>Coffee Admin</title>
        <link rel="icon" href="{{ url_for('static', filename='coffee_icon.png') }}" type="image/png">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                height: 100vh;
                height: 100svh;
                margin: 0;
                padding: 24px 16px;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                gap: 12px;
                text-align: center;
                background-image: url("{{ url_for('static', filename='coffeebean_background.jpg') }}");
                background-size: cover;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif, serif;
                background-color: #f4f4f4;
                overflow: hidden;
            }
            div.content {
                position: relative;
                width: 100%;
                flex: 1;
                height: auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
                text-align: center;
                background-color: rgba(240, 240, 240, 0.75);
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            .settings-button {
                position: absolute;
                top: 18px;
                right: 18px;
                width: 42px;
                height: 42px;
                display: inline-flex;
                justify-content: center;
                align-items: center;
                border: 0;
                border-radius: 8px;
                background: rgba(97, 54, 4, 0.12);
                color: #613604;
                cursor: pointer;
            }
            .settings-button:hover {
                background: rgba(97, 54, 4, 0.22);
            }
            .settings-button svg {
                width: 24px;
                height: 24px;
                fill: currentColor;
            }
            .settings-overlay[hidden],
            .settings-dialog[hidden] {
                display: none;
            }
            .settings-overlay {
                position: fixed;
                inset: 0;
                z-index: 1100;
                background: rgba(0, 0, 0, 0.55);
            }
            .settings-dialog {
                position: fixed;
                inset: 50% auto auto 50%;
                transform: translate(-50%, -50%);
                z-index: 1101;
                width: min(900px, calc(100vw - 32px));
                height: min(700px, calc(100vh - 32px));
                overflow: hidden;
                border-radius: 14px;
                background: #f4f4f4;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }
            .settings-dialog-header {
                height: 48px;
                display: flex;
                justify-content: flex-end;
                align-items: center;
                padding: 6px 10px;
            }
            .settings-close {
                width: 36px;
                height: 36px;
                border: 0;
                border-radius: 6px;
                background: transparent;
                color: #613604;
                font-size: 26px;
                cursor: pointer;
            }
            .settings-close:hover {
                background: rgba(97, 54, 4, 0.12);
            }
            .settings-dialog iframe {
                display: block;
                width: 100%;
                height: calc(100% - 48px);
                border: 0;
                background: #fff;
            }
            h1 {
                margin: 0;
                padding: 10px;
                font-size: clamp(2.5rem, 8vw, 5.625rem);
                color: #613604;
                text-shadow: 2px 2px 4px rgba(100, 100, 100, 0.5);
            }
            .namesettings {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                gap: 20px;
                margin-top: 20px;
            }
            .donor-grid {
                flex: 1;
                min-height: 0;
                width: min(100%, 1100px);
                margin-inline: auto;
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                grid-auto-rows: 320px;
                align-content: start;
                gap: 20px;
                overflow-y: auto;
                padding: 4px 25px 4px 4px;
                scrollbar-width: thin;
                scrollbar-color: rgba(97, 54, 4, 0.65) transparent;
            }
            .donor-grid::-webkit-scrollbar {
                width: 8px;
            }
            .donor-grid::-webkit-scrollbar-track {
                background: transparent;
            }
            .donor-grid::-webkit-scrollbar-thumb {
                background-color: rgba(97, 54, 4, 0.65);
                border-radius: 999px;
            }
            .donor-grid::-webkit-scrollbar-button {
                display: none;
                width: 0;
                height: 0;
            }
            .plus-card {
                width: 100px;
                height: 100px;
                display: flex;
                justify-self: center;
                align-self: center;
                justify-content: center;
                align-items: center;
                font-size: 48px;
                color: rgb(240, 240, 240);
                background-color: rgba(97, 54, 4, 0.75);
                border-radius: 20px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                cursor: pointer;
                transition: transform 0.2s ease-in-out;
                border: 0;
                font-family: inherit;
            }
            .plus-card:hover {
                transform: scale(1.1);
            }
            .plus-card:active {
                transform: scale(0.9);
            }
            .donorcard {
                width: 100%;
                height: 320px;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                font-size: 24px;
                color: #613604;
                background-color: rgba(240, 240, 240, 0.75);
                border-radius: 20px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                padding: 20px;
            }
            .donorcard.empty {
                justify-content: center;
            }
            .donorcard h4 {
                width: 100%;
                margin: 0 0 12px;
                font-size: 38px;
                font-weight: bold;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif, serif;
                color: #8b5e34;
                text-align: center;
                text-shadow: 2px 2px 4px rgba(50, 30, 10, 0.45);
                overflow-wrap: anywhere;
            }
            .donor-details {
                flex: 1;
                width: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            .donor-actions {
                width: 100%;
                display: flex;
                gap: 8px;
                margin-top: 12px;
            }
            .donor-actions button {
                flex: 1;
                padding: 8px;
                border: 0;
                border-radius: 5px;
                background-color: #8b5e34;
                color: white;
                font: inherit;
                font-size: 16px;
                cursor: pointer;
            }
            .donor-actions button:hover {
                background-color: #5c3801;
            }
            .donorcard h5 {
                margin: 0;
                overflow-wrap: anywhere;
                font-size: 26px;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif, serif;
                color: #613604;
                text-shadow: 2px 2px 4px rgba(100, 100, 100, 0.5);
            }
            .donorcard p {
                margin: 5px 0;
                overflow-wrap: anywhere;
                font-size: 23px;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif, serif;
                color: #613604;
                text-shadow: 2px 2px 4px rgba(100, 100, 100, 0.5);
            }
            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 999;
            }
            .overlay[hidden],
            form.donor[hidden],
            .form-error[hidden] {
                display: none;
            }
            form.donor {
                display: flex;
                flex-direction: column;
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 1000;
                width: 90vw;
                height: 90vh;
                max-width: 600px;
                max-height: 600px;
                overflow-y: auto;
                background-color: rgba(240, 240, 240, 1);
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                text-align: center;
                font-size: 30px;
            }
            form.donor h3 {
                margin: 0 0 24px;
                font-size: 36px;
                font-weight: bold;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Times, serif, serif;
                color: #613604;
                text-shadow: 2px 2px 4px rgba(100, 100, 100, 0.5);
            }
            form.donor input,
            .message-editor {
                width: 100%;
                padding: 14px;
                margin: 10px 0;
                border: 1px solid #ccc;
                border-radius: 5px;
                box-sizing: border-box;
                font-size: 24px;
            }
            .message-toolbar {
                display: flex;
                justify-content: flex-start;
                gap: 8px;
                margin-top: 10px;
            }
            form.donor .message-toolbar button {
                width: 44px;
                height: 44px;
                display: inline-flex;
                justify-content: center;
                align-items: center;
                margin: 0;
                padding: 8px;
                border: 1px solid #8b5e34;
                border-radius: 8px;
                background: #fff;
                color: #613604;
                font-size: 18px;
                cursor: pointer;
            }
            form.donor .message-toolbar button:hover {
                background: #f1e7d8;
            }
            .message-toolbar svg {
                width: 22px;
                height: 22px;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .message-editor {
                flex: 1 1 auto;
                min-height: 120px;
                line-height: 1.4;
                overflow-y: auto;
                text-align: start;
            }
            .message-editor ul {
                margin-block: 0.2em;
                padding-inline-start: 1.4em;
                font-size: 21px;
                line-height: 1.2;
            }
            .message-editor li {
                margin-block: 0;
                padding: 0;
            }
            .message-editor:empty::before {
                content: attr(data-placeholder);
                color: #757575;
                pointer-events: none;
            }
            .form-buttons {
                display: flex;
                justify-content: space-between;
                gap: 10px;
            }
            form.donor button {
                width: 100%;
                margin-top: 20px;
                padding: 15px;
                background-color: #caa359;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 23px;
            }
            form.donor button:hover {
                background-color: #5c3801;
            }
            .form-error {
                margin: 12px 0 0;
                color: #a00000;
                font-size: 18px;
            }
            @media (max-width: 1024px) {
                .namesettings {
                    gap: 15px;
                }
                .donor-grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                }
            }
            @media (max-width: 600px) {
                body {
                    padding: 12px;
                }
                div.content {
                    padding: 16px;
                }
                .donor-grid {
                    grid-template-columns: minmax(0, 1fr);
                    grid-auto-rows: 320px;
                }
            }
        </style>
    </head>
    <body>
        <div class="content">
            <button type="button" class="settings-button" aria-label="Open settings" title="Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19.4 13a7.8 7.8 0 0 0 0-2l2-1.5-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L15 3.5h-4L10.6 6a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7.7 7.7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"></path>
                </svg>
            </button>
            <h1>Coffee Admin</h1>
            <div class="namesettings">
                <div class="donor-grid">
                {% for donor in donors %}
                <div class="donorcard">
                    <h4>{{ donor['type'] }}</h4>
                    <div class="donor-details">
                        <h5>{{ donor['donor_name'] }}</h5>
                        <p>{{ donor['message'] }}</p>
                    </div>
                    <div class="donor-actions">
                        <button
                            type="button"
                            class="edit-donor"
                            data-type="{{ donor['type'] }}"
                            data-name="{{ donor['donor_name'] }}"
                            data-message="{{ donor['message']|forceescape }}"
                            data-update-url="{{ url_for('update_donor', donor_id=donor['id']) }}"
                        >Edit</button>
                        <button
                            type="button"
                            class="delete-donor"
                            data-delete-url="{{ url_for('delete_donor', donor_id=donor['id']) }}"
                        >Delete</button>
                    </div>
                </div>
                {% else %}
                <div class="donorcard empty">
                    No donors yet
                </div>
                {% endfor %}
                <button type="button" class="plus-card" aria-label="Add donor">
                    +
                </button>
                </div>
            </div>
        </div>
        <div class="overlay" hidden></div>
        <form class="donor" action="{{ url_for('create_donor') }}" method="post" hidden>
            <h3 id="donor-form-title">Add New Donor</h3>
            <input type="text" name="type" placeholder="סוג" lang="he" dir="rtl" required>
            <input type="text" name="donor_name" placeholder="שם הנדבן" lang="he" dir="rtl" required>
            <div class="message-toolbar" role="toolbar" aria-label="Message formatting">
                <button type="button" data-command="bold" aria-label="Bold" title="Bold"><strong>B</strong></button>
                <button type="button" data-command="italic" aria-label="Italic" title="Italic"><em>I</em></button>
                <button type="button" data-command="insertUnorderedList" aria-label="Bulleted list" title="Bulleted list">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="5" cy="6" r="1"></circle>
                        <circle cx="5" cy="12" r="1"></circle>
                        <circle cx="5" cy="18" r="1"></circle>
                        <path d="M10 6h9M10 12h9M10 18h9"></path>
                    </svg>
                </button>
            </div>
            <div class="message-editor" contenteditable="true" role="textbox" aria-label="Message" aria-multiline="true" data-placeholder="מסר" lang="he" dir="rtl"></div>
            <input type="hidden" name="message">
            <div class="form-buttons">
                <button type="button" class="close">Cancel</button>
                <button type="submit" class="submit-donor">Add Donor</button>
            </div>
            <p class="form-error" role="alert" hidden></p>
        </form>
        <div class="settings-overlay" hidden></div>
        <section class="settings-dialog" role="dialog" aria-modal="true" aria-label="Settings" hidden>
            <div class="settings-dialog-header">
                <button type="button" class="settings-close" aria-label="Close settings">&times;</button>
            </div>
            <iframe src="{{ url_for('admin_settings') }}" title="Settings"></iframe>
        </section>
        <script>
            const donorForm = document.querySelector('form.donor');
            const overlay = document.querySelector('.overlay');
            const openDonorFormButton = document.querySelector('.plus-card');
            const closeDonorFormButton = donorForm.querySelector('.close');
            const submitDonorButton = donorForm.querySelector('.submit-donor');
            const formError = donorForm.querySelector('.form-error');
            const createDonorUrl = donorForm.action;
            const messageEditor = donorForm.querySelector('.message-editor');
            const messageInput = donorForm.elements.message;
            const settingsButton = document.querySelector('.settings-button');
            const settingsOverlay = document.querySelector('.settings-overlay');
            const settingsDialog = document.querySelector('.settings-dialog');
            const settingsCloseButton = document.querySelector('.settings-close');

            function closeSettings() {
                settingsOverlay.hidden = true;
                settingsDialog.hidden = true;
                settingsButton.focus();
            }

            settingsButton.addEventListener('click', () => {
                settingsOverlay.hidden = false;
                settingsDialog.hidden = false;
                settingsCloseButton.focus();
            });
            settingsCloseButton.addEventListener('click', closeSettings);
            settingsOverlay.addEventListener('click', closeSettings);
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && !settingsDialog.hidden) {
                    closeSettings();
                }
            });

            donorForm.querySelectorAll('.message-toolbar [data-command]').forEach((button) => {
                button.addEventListener('mousedown', (event) => event.preventDefault());
                button.addEventListener('click', () => {
                    messageEditor.focus();
                    document.execCommand(button.dataset.command, false, null);
                });
            });

            function showDonorForm() {
                donorForm.hidden = false;
                overlay.hidden = false;
                formError.hidden = true;
                donorForm.elements.type.focus();
            }

            function prepareNewDonor() {
                donorForm.reset();
                messageEditor.innerHTML = '';
                donorForm.action = createDonorUrl;
                donorForm.querySelector('#donor-form-title').textContent = 'Add New Donor';
                submitDonorButton.textContent = 'Add Donor';
                showDonorForm();
            }

            function closeDonorForm() {
                donorForm.hidden = true;
                overlay.hidden = true;
                openDonorFormButton.focus();
            }

            openDonorFormButton.addEventListener('click', prepareNewDonor);
            document.querySelectorAll('.edit-donor').forEach((button) => {
                button.addEventListener('click', () => {
                    donorForm.reset();
                    donorForm.action = button.dataset.updateUrl;
                    donorForm.elements.type.value = button.dataset.type;
                    donorForm.elements.donor_name.value = button.dataset.name;
                    messageEditor.innerHTML = button.dataset.message;
                    donorForm.querySelector('#donor-form-title').textContent = 'Edit Donor';
                    submitDonorButton.textContent = 'Save Changes';
                    showDonorForm();
                });
            });
            document.querySelectorAll('.delete-donor').forEach((button) => {
                button.addEventListener('click', async () => {
                    if (!window.confirm('Are you sure you want to delete this donor?')) {
                        return;
                    }

                    button.disabled = true;
                    try {
                        const response = await fetch(button.dataset.deleteUrl, {
                            method: 'POST',
                            headers: { Accept: 'application/json' },
                        });
                        const result = await response.json();
                        if (!response.ok || result.success !== true) {
                            throw new Error(result.error || 'Could not delete donor.');
                        }
                        window.location.reload();
                    } catch (error) {
                        window.alert(error.message || 'Could not delete donor. Please try again.');
                        button.disabled = false;
                    }
                });
            });
            closeDonorFormButton.addEventListener('click', closeDonorForm);
            overlay.addEventListener('click', closeDonorForm);
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && !donorForm.hidden) {
                    closeDonorForm();
                }
            });

            donorForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                messageInput.value = messageEditor.innerHTML;
                if (!messageEditor.textContent.trim()) {
                    messageEditor.focus();
                    formError.textContent = 'Message is required.';
                    formError.hidden = false;
                    return;
                }
                submitDonorButton.disabled = true;
                formError.hidden = true;

                try {
                    const response = await fetch(donorForm.action, {
                        method: 'POST',
                        body: new FormData(donorForm),
                        headers: { Accept: 'application/json' },
                    });
                    const result = await response.json();
                    if (!response.ok || result.success !== true) {
                        throw new Error(result.error || 'Could not add donor.');
                    }
                    window.location.reload();
                } catch (error) {
                    formError.textContent = error.message || 'Could not add donor. Please try again.';
                    formError.hidden = false;
                } finally {
                    submitDonorButton.disabled = false;
                }
            });
        </script>
    </body>
</html>
