<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Coffee Settings</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                padding: 24px;
                background: rgba(239, 226, 207, 0.96);
                color: #613604;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, sans-serif;
            }
            main {
                width: min(100%, 720px);
                margin: 0 auto;
            }
            h1 {
                margin: 0 0 18px;
                font-size: 32px;
                color: #613604;
            }
            fieldset {
                margin: 0 0 18px;
                padding: 18px;
                border: 1px solid rgba(97, 54, 4, 0.3);
                border-radius: 12px;
                background: rgba(255, 255, 255, 0.46);
            }
            legend {
                padding: 0 8px;
                font-size: 20px;
                font-weight: bold;
            }
            .field {
                display: grid;
                gap: 6px;
                margin: 12px 0;
            }
            label {
                font-weight: 600;
            }
            input[type="text"],
            input[type="password"],
            input[type="number"],
            select,
            textarea {
                width: 100%;
                min-height: 42px;
                padding: 8px 10px;
                border: 1px solid #b9a78f;
                border-radius: 6px;
                background: #fffdf9;
                color: #33200d;
                font: inherit;
            }
            .color-control {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            input[type="color"] {
                width: 48px;
                height: 42px;
                padding: 3px;
                border: 1px solid #b9a78f;
                border-radius: 6px;
                background: #fffdf9;
            }
            input[type="range"] {
                width: 100%;
                accent-color: #8b5e34;
            }
            .hint {
                margin: 2px 0 0;
                color: #684d31;
                font-size: 14px;
            }
            .save-row {
                display: flex;
                align-items: center;
                gap: 14px;
            }
            button[type="submit"] {
                min-height: 44px;
                padding: 9px 20px;
                border: 0;
                border-radius: 7px;
                background: #8b5e34;
                color: white;
                font: inherit;
                font-weight: bold;
                cursor: pointer;
            }
            button[type="submit"]:hover {
                background: #5c3801;
            }
            button:disabled {
                cursor: wait;
                opacity: 0.7;
            }
            #save-status {
                margin: 0;
                font-size: 15px;
            }
            #save-status.error {
                color: #a00000;
            }
            .account-open {
                min-height: 42px;
                margin-bottom: 18px;
                padding: 8px 14px;
                border: 1px solid #8b5e34;
                border-radius: 7px;
                background: rgba(255, 255, 255, 0.55);
                color: #613604;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
            .account-dialog {
                width: min(560px, calc(100vw - 32px));
                max-height: calc(100vh - 32px);
                padding: 22px;
                border: 1px solid rgba(97, 54, 4, 0.35);
                border-radius: 14px;
                background: #efe2cf;
                color: #613604;
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
            }
            .account-dialog::backdrop {
                background: rgba(0, 0, 0, 0.55);
            }
            .account-dialog h2 {
                margin: 0 0 14px;
            }
            .dialog-actions {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .dialog-actions button[type="button"] {
                min-height: 44px;
                padding: 8px 16px;
                border: 1px solid #8b5e34;
                border-radius: 7px;
                background: transparent;
                color: #613604;
                font: inherit;
                cursor: pointer;
            }
            @media (max-width: 480px) {
                body {
                    padding: 16px;
                }
                fieldset {
                    padding: 14px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Settings</h1>
            <form id="settings-form" action="{{ url_for('save_admin_settings') }}">
                <fieldset>
                    <legend>Display</legend>
                    <div class="field">
                        <label for="display-title">Display title</label>
                        <input id="display-title" name="display_title" type="text" value="{{ settings['display_title'] }}" required maxlength="100">
                    </div>
                    <div class="field">
                        <label for="background-color">Background color</label>
                        <div class="color-control">
                            <input id="background-color" name="background_color" type="color" value="{{ settings['background_color'] }}">
                            <output id="background-color-value" for="background-color">{{ settings['background_color'] }}</output>
                        </div>
                    </div>
                    <div class="field">
                        <label for="background-opacity">Background opacity: <output id="opacity-value">{{ (settings['background_opacity'] * 100)|round|int }}%</output></label>
                        <input id="background-opacity" name="background_opacity" type="range" min="0.25" max="1" step="0.05" value="{{ settings['background_opacity'] }}">
                    </div>
                    <div class="field">
                        <label for="refresh-interval">Refresh interval (seconds)</label>
                        <input id="refresh-interval" name="refresh_interval" type="number" min="1" max="3600" step="1" value="{{ settings['refresh_interval'] }}" required>
                    </div>
                    <div class="field">
                        <label for="font">Slideshow font</label>
                        <select id="font" name="font">
                            <option value="David Libre" {% if settings['font'] == 'David Libre' %}selected{% endif %}>David Libre</option>
                            <option value="Arial" {% if settings['font'] == 'Arial' %}selected{% endif %}>Arial</option>
                            <option value="Georgia" {% if settings['font'] == 'Georgia' %}selected{% endif %}>Georgia</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="time-per-frame">Time per frame (seconds)</label>
                        <input id="time-per-frame" name="time_per_frame" type="number" min="1" max="3600" step="1" value="{{ settings['time_per_frame'] }}" required>
                    </div>
                    <div class="field">
                        <label for="effect">Slideshow effect</label>
                        <select id="effect" name="effect">
                            <option value="none" {% if settings['effect'] == 'none' %}selected{% endif %}>None</option>
                            <option value="sliding" {% if settings['effect'] == 'sliding' %}selected{% endif %}>Sliding</option>
                            <option value="fading" {% if settings['effect'] == 'fading' %}selected{% endif %}>Fading</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="start-frame">Optional start frame</label>
                        <textarea id="start-frame" name="start_frame" rows="3" maxlength="500">{{ settings['start_frame'] }}</textarea>
                        <p class="hint">Shown once before the donor entries. Leave blank to skip it.</p>
                    </div>
                </fieldset>
                <button type="button" class="account-open">Change username or password</button>
                <div class="save-row">
                    <button type="submit">Save settings</button>
                    <p id="save-status" role="status" aria-live="polite"></p>
                </div>
            </form>
            <dialog class="account-dialog" aria-labelledby="account-dialog-title">
                <h2 id="account-dialog-title">Administrator account</h2>
                <form id="account-form" action="{{ url_for('save_admin_account') }}">
                    <div class="field">
                        <label for="admin-username">Username</label>
                        <input id="admin-username" name="admin_username" type="text" value="{{ settings['admin_username'] }}" autocomplete="username" required maxlength="100">
                    </div>
                    <div class="field">
                        <label for="current-password">Current password</label>
                        <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
                    </div>
                    <div class="field">
                        <label for="new-password">New password</label>
                        <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="8">
                        <p class="hint">Leave blank to keep the current password. Use at least 8 characters to change it.</p>
                    </div>
                    <div class="field">
                        <label for="confirm-password">Confirm new password</label>
                        <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="8">
                    </div>
                    <div class="dialog-actions">
                        <button type="submit">Save account</button>
                        <button type="button" class="account-cancel">Cancel</button>
                        <p id="account-status" role="status" aria-live="polite"></p>
                    </div>
                </form>
            </dialog>
        </main>
        <script>
            // Cache the settings form, status displays, and account dialog controls.
            const form = document.querySelector('#settings-form');
            const status = document.querySelector('#save-status');
            const saveButton = form.querySelector('button[type="submit"]');
            const colorInput = form.elements.background_color;
            const colorValue = document.querySelector('#background-color-value');
            const opacityInput = form.elements.background_opacity;
            const opacityValue = document.querySelector('#opacity-value');
            const accountDialog = document.querySelector('.account-dialog');
            const accountForm = document.querySelector('#account-form');
            const accountStatus = document.querySelector('#account-status');
            const accountSaveButton = accountForm.querySelector('button[type="submit"]');

            // Keep the displayed color and opacity values in sync with their input controls.
            colorInput.addEventListener('input', () => {
                colorValue.value = colorInput.value;
                colorValue.textContent = colorInput.value;
            });
            opacityInput.addEventListener('input', () => {
                opacityValue.value = `${Math.round(Number(opacityInput.value) * 100)}%`;
                opacityValue.textContent = opacityValue.value;
            });

            // Send updated display settings to the server and show success or error feedback.
            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                status.classList.remove('error');
                status.textContent = '';

                saveButton.disabled = true;
                status.textContent = 'Saving…';
                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify({
                            display_title: form.elements.display_title.value,
                            background_color: colorInput.value,
                            background_opacity: Number(opacityInput.value),
                            refresh_interval: Number(form.elements.refresh_interval.value),
                            font: form.elements.font.value,
                            time_per_frame: Number(form.elements.time_per_frame.value),
                            effect: form.elements.effect.value,
                            start_frame: form.elements.start_frame.value,
                        }),
                    });
                    const result = await response.json();
                    if (!response.ok || result.success !== true) {
                        throw new Error(result.error || 'Could not save settings.');
                    }
                    status.textContent = 'Settings saved.';
                } catch (error) {
                    status.textContent = error.message || 'Could not save settings.';
                    status.classList.add('error');
                } finally {
                    saveButton.disabled = false;
                }
            });

            // Open the account dialog with a clean status and focus the current-password field.
            document.querySelector('.account-open').addEventListener('click', () => {
                accountStatus.textContent = '';
                accountStatus.classList.remove('error');
                accountDialog.showModal();
                accountForm.elements.current_password.focus();
            });

            // Close the account dialog without submitting the form.
            document.querySelector('.account-cancel').addEventListener('click', () => {
                accountDialog.close();
            });

            // Check that the new passwords match, save account changes, and report the result.
            accountForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                accountStatus.textContent = '';
                accountStatus.classList.remove('error');

                const newPassword = accountForm.elements.new_password.value;
                if (newPassword !== accountForm.elements.confirm_password.value) {
                    accountStatus.textContent = 'New passwords do not match.';
                    accountStatus.classList.add('error');
                    return;
                }

                accountSaveButton.disabled = true;
                accountStatus.textContent = 'Saving…';
                try {
                    const response = await fetch(accountForm.action, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                        },
                        body: JSON.stringify({
                            admin_username: accountForm.elements.admin_username.value,
                            current_password: accountForm.elements.current_password.value,
                            new_password: newPassword,
                        }),
                    });
                    const result = await response.json();
                    if (!response.ok || result.success !== true) {
                        throw new Error(result.error || 'Could not save account settings.');
                    }
                    accountForm.elements.admin_username.value = result.admin_username;
                    accountForm.elements.current_password.value = '';
                    accountForm.elements.new_password.value = '';
                    accountForm.elements.confirm_password.value = '';
                    accountStatus.textContent = 'Account settings saved.';
                } catch (error) {
                    accountStatus.textContent = error.message || 'Could not save account settings.';
                    accountStatus.classList.add('error');
                } finally {
                    accountSaveButton.disabled = false;
                }
            });
        </script>
    </body>
</html>
