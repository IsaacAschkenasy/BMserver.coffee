services:
  coffee:
    image: isaacaschke/coffee
    container_name: coffee
    restart: unless-stopped
    networks:
      - proxy-net
    environment:
      DB_PATH: /usr/data/coffee/data.db
      SETTINGS_PATH: /usr/data/coffee/settings.json
    volumes:
      - coffee-data:/usr/data/coffee

volumes:
  coffee-data:

networks:
  proxy-net:
    external: true